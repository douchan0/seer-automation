# 谱尼目标图（机器可读版）
#
# 来源：docs/PUNI_TASK_GRAPH.md（917 行，42 个节点 P0-01..P4-04）＋ Round 4 真机事实。
# 规则：任何节点都只能被「当前账号的观测证据」判定完成；文档说法属 HISTORICAL，
#      永远不能完成任务（见 seerauto/goals/predicates.py）。
#
# 本文件是规划器唯一需要读的谱尼资料。不要再去读 42 页 markdown 猜状态。

version: 1
goal: puni
title: 获取谱尼
updated: "2026-11-02"
source: docs/PUNI_TASK_GRAPH.md

conventions:
  phases:
    P0: prepare
    P1: roster
    P2: seal
    P3: truebody
    P4: crosscut

  status:
    proven: 真机完整跑通且有日志/截图证据
    partial: 部分环节真机验证过，或只成功过一次
    todo: 能力可实现，尚未做过
    unverified: 机制已知但从未在本账号上观测过；文档说法未被复核
    blocked: 外部状态阻塞，写再多代码也过不去
    unknown: 机制本身不明，或当前账号数值未被观测

  completion_types:
    verified_account_state: 唯一可自动完成的类型；predicate 读 GameWorldState 的当前证据
    capability_demonstrated: 横切能力节点；只有人/工具能把节点加入 completed，本图永不自动完成

  world_keys:
    pets: "world.pets[<精灵名>] = PetState(level, evidence)"
    resources: "world.resources[<资源名>] = ResourceState(amount, evidence)"
    spt: "world.spt[<boss_id 或面板名>] = SptEntry(defeated, name, evidence)"
    unlocks: "world.unlocked[<key>] = Fact(bool)，由观察者写入"
    counters: "world.facts['counters.<name>'] = Fact(int)，只在观测到效果后 +1"
    spt_panel: "world.facts['panel.spt_open'] = Fact(bool)"

  unlock_keys:
    market: 交易行可进入且能搜索挂单（SPT 面板原文：击败后解锁交易行资格）
    buff.exp8x: 当日 8 倍经验/4 倍学习力已开启
    daily.signin: 今日签到已完成
    settings.compressed_animation: 系统设置里「呼吸模式」与「压缩超长出招动画」已勾选
    training.effort_maxed: 学习力训练完成（面板读数）
    exp_giver.poured: 经验分配器灌注过一次且目标精灵等级确实上升
    team.composed: 出战阵容与关卡要求一致（进战前选择面板读数）
    puni.panel.reachable: 谱尼封印选择面板可达（人工或自动）
    puni.seal.1: 虚无封印 已通关（面板显示）
    puni.seal.2: 元素封印 已通关（面板显示）
    puni.seal.3: 能量封印 已通关（面板显示）
    puni.seal.4: 生命封印 已通关（面板显示）
    puni.seal.5: 轮回封印 已通关（面板显示）
    puni.seal.6: 永恒封印 已通关（面板显示）
    puni.seal.7: 圣洁封印 已通关（面板显示）
    puni.truebody.entered: 已进入谱尼真身战斗且屏幕显示「第一命」
    puni.truebody.life1: 真身第一命已清
    puni.truebody.life2: 真身第二命已清
    puni.truebody.life3: 真身第三命已清
    puni.truebody.life4: 真身第四命已清
    puni.truebody.life5: 真身第五命已清
    puni.truebody.defeated: 谱尼真身已被击败（成就面板/胜利面板）

  counters:
    tower.floors_cleared: 塔内已清的楼层数（只在观测到层数推进后 +1，不记意图）
    tower.floors_reached: 塔面板显示「你当前到达第N层」的 N（读数，不等于已清层数）

  predicates:
    completion: "pet_level_at_least / pet_exists / spt_defeated / spt_defeated_count_at_least / resource_at_least / feature_unlocked / counter_at_least / capability_demonstrated"
    state: "active_pet_level_known / scene_is / logged_in / spt_panel_open / battle_capable"
    caution: "HISTORICAL（文档）与 UNKNOWN（没看）都返回 None，永远不等于 False，也永远不能完成任务"

  skills: "skill 字段写的是“该节点应由哪个语义技能执行”，不保证已实现；真机只有 game.run_battle 有原型（tools/battle_run.py）"

capabilities:
  battle.attribute_reverse:
    summary: 纳多雷「属性反转」与谱尼交换属性（圣灵→地面），并用战报确认生效；6/7 封印与真身 3/5 命的公共机制
    verified: unverified
    evidence: docs/research/PUNI_CURRENT_VERSION_GUIDE.md
  battle.pp_drain:
    summary: 用「回避 / 相位移动」把谱尼有限的 PP 耗光，以「圣光气」出现作为空 PP 判据
    verified: unverified
    evidence: docs/research/PUNI_CURRENT_VERSION_GUIDE.md
  observe.truebody_life:
    summary: 读真身战斗画面正中的「谱尼真身 / 第N命 / （X封印）」大字，得到当前命数
    verified: unverified
    evidence: frames/07_truebody_s/f_00004.png
  observe.battle_log_event:
    summary: 解析「当前战报」滚动文本（被击败了 / 致命一击 / 使用了X / 圣光气）成结构化事件
    verified: unverified
    evidence: frames/_ocr.json
  map.open:
    summary: 打开星际地图并点选目的地（地图图标在屏幕中央，位置稳定）
    verified: real
    evidence: artifacts/round5/07_map.png
  puni.entrance:
    summary: SPT→太空站左翼→谱尼→前往 可达勇者之塔神秘领域（2026-11-03 真机验证）
    verified: real
    evidence: artifacts/round5/09_puni_entrance.png
  observe.window:
    summary: 查找游戏窗口 + 几何冻结（选面积最大的窗口，忽略 <200px 的辅助窗口）
    verified: real
    evidence: docs/progress.md#round-4
  observe.capture:
    summary: 区域截图（常驻 SCStream 暖流读最新帧，mean 18.95 ms）
    verified: real
    evidence: docs/progress.md#round-4
  observe.ocr:
    summary: 中文 OCR（归一化 bbox；升级路径 mean 1177.97 ms，只在必要时走）
    verified: real
    evidence: docs/progress.md#round-4
  observe.template:
    summary: 真机模板匹配（8 个 live 模板，含战斗按钮/胜利面板/确认按钮）
    verified: real
    evidence: docs/progress.md#round-4
  input.click:
    summary: 局部像素 → 屏幕点击；Round 4 已验证「点击后状态变化」（回合 1→3、战报变化），点击落空会被检测并安全停止
    verified: real
    evidence: docs/progress.md#round-4
  input.hover_text:
    summary: 悬停后点「前往/挑战/进入」（CAP-HOVERBTN，未系统验证）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  input.type_text:
    summary: 中文键盘输入（keyboardSetUnicodeString 路径存在，未见成功用例）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.repeat:
    summary: 本地状态机连战（进战斗→出招→等回合→胜利→确认→再开）；真机 3 场连战全胜，每场约 17 次点击
    verified: real
    evidence: docs/progress.md#round-4
    notes: 只在「克洛斯星林间」的野外怪上验证；勇者之塔/试炼之塔的入口与楼层导航未验证
  battle.skill_select:
    summary: 按名字点四技能格之一（坐标已推算，未逐个点击验证 —— G4）
    verified: unverified
    evidence: docs/state.md#已验证界面坐标
  battle.switch_pet:
    summary: 战斗内换精灵（CAP-SWITCH，「精灵」按钮未验证）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.item_use:
    summary: 战斗内用药（CAP-ITEM，「道具」按钮未验证）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.log_read:
    summary: 读「当前战报」滚动文本流（`圣光气` = 空 PP 判定，性价比最高）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.hp_read:
    summary: 解析 `159/361` 取血量/血比（OCR 已能读到文本，缺解析器）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.pp_read:
    summary: 解析 `使用次数：25/30`
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.stage_read:
    summary: 读 `虚无封印` / `第N命` / `当前回合`
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.buff_count:
    summary: 数左边缘 buff 图标层数（「毒剩 1 回合」类预判的前提）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  battle.escape:
    summary: 逃跑（CAP-ESCAPE，只试过一次即坐标失准失败）
    verified: unverified
    evidence: docs/action-log.md
  battle.defeat_branch:
    summary: 战败/结算失败分支的识别（G1：没有任何失败样本，`失败` 模板不存在）
    verified: unverified
    evidence: AGENTS.md#6
  battle.long_watch:
    summary: 长战看护（回合单调性、无进展升级、弹窗识别、断线恢复、预算急停）
    verified: unverified
    evidence: docs/progress.md#round-4
    notes: 预算/停滞守卫/暂停恢复已真机验证；165 回合长战与断线恢复未验证
  spt.panel:
    summary: SPT 面板读取（图标→面板→卡片文本→已击败/未击败；面板原文可读「击败后解锁交易行资格」）
    verified: real
    evidence: docs/progress.md#round-4
  spt.navigate:
    summary: SPT 卡片 →「前往」→ 传送到首领场景（蘑菇怪 → 克洛斯星林间，真机验证）
    verified: real
    evidence: docs/progress.md#round-4
    notes: 只对蘑菇怪这一个卡片验证过；其余星球/星系的卡片与滚动未验证
  daily.quota:
    summary: 每日额度读取与调度（CAP-DAILY，含谱尼每日 4 次）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  market.buy:
    summary: 交易行 搜名/筛个体性格/购买（原语够，但门未开）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  shop.buy:
    summary: 官方商城购买（只 OCR 读过 141 件商品，从未购买）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  team.compose:
    summary: 出战队伍编排（CAP-TEAM）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  train.effort:
    summary: 学习力训练室六选一（CAP-TRAIN）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  exp.give:
    summary: 经验分配器灌注（CAP-EXPGIVE）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  catch.pet:
    summary: 抓宠（削血 + 投胶囊，CAP-CATCH）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  fuse.pet:
    summary: 融合转生（CAP-FUSION，流程未完整展示）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  settings.animation:
    summary: 系统设置面板勾选出招动画压缩/呼吸模式
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#1
  budget.stop:
    summary: 次数/时长预算 + 停滞守卫 + 暂停/恢复/急停 + 带原因安全停止
    verified: real
    evidence: docs/progress.md#round-4
  puni.panel:
    summary: 谱尼入口导航（太空站左翼 → 勇者之塔神秘领域 → 点击谱尼）
    verified: unverified
    evidence: docs/PUNI_TASK_GRAPH.md#P2-01
    notes: 只有 Round 3 人工按旧坐标到达过一次；Round 4 换了坐标系，未重测

nodes:
  # ------------------------------------------------------------------ P0 --
  - id: puni.prepare.market_unlock
    legacy_id: P0-01
    title: 交易行解锁
    description: 取得交易行资格，使萨帕克/闪光波克尔/卡奥鲁/尼尔这四只只能从交易行获得的精灵可购买。
    phase: P0
    priority: 95
    prerequisites: [state.logged_in]
    requires_capabilities: [spt.panel]
    completion:
      type: verified_account_state
      predicate: feature_unlocked
      args: {feature: market}
    status: unknown
    executable: false
    skill: game.check_market_gate
    skill_inputs: {read_only: true}
    budget: {max_minutes: 60, max_battles: 0, max_spend: 0}
    on_failure: mark_blocked
    evidence:
      - docs/PUNI_TASK_GRAPH.md#P0-01
      - docs/state.md#进度
      - docs/progress.md#round-4
    blocked_reason: 交易行面板本轮从未打开；解锁所需的首领集合（几只/哪几只）未观测，且人类从未演示过解锁过程
    notes: "文档已过期两处。① 门槛性质：docs §0.1 与 U-A1 怀疑是「注册满 3 天」的时间门槛，Round 4 读了 SPT 面板，每张首领卡下方写着「击败后解锁交易行资格」→ 门槛是击败 SPT 首领（任务门槛），不是时间门槛（U-A1 已答）。② 进度：文档称三条任务「实测 0/3」，但 docs/state.md 记录 2026-11-02 已击败 蘑菇怪（克洛斯星-克洛斯星林间）→ 0/3 已过时。仍未观测：击败 1 只首领是否足够、还需要哪几只、交易行面板本身能否进入。注意 SPT 面板显示 73 个入口。"
  - id: puni.prepare.daily_exp_pool
    legacy_id: P0-02
    title: 每日 50 万经验（找 50 级野怪开战即逃跑）
    description: 在含 50 级野生精灵的场景开战，立刻逃跑，拿每日一次的经验池 50 万。
    phase: P0
    priority: 45
    prerequisites: [capability.battle.escape, state.battle_capable]
    requires_capabilities: [battle.escape, observe.ocr]
    completion:
      type: verified_account_state
      predicate: resource_at_least
      args: {resource: 积累经验, amount: 500000}
    status: todo
    executable: false
    skill: game.escape_battle
    skill_inputs: {battles: 1}
    budget: {max_minutes: 15, max_battles: 1, max_spend: 0}
    on_failure: pause_and_replan
    evidence:
      - docs/PUNI_TASK_GRAPH.md#P0-02
    blocked_reason: CAP-ESCAPE 未验证（只试过一次即坐标失准失败）；「经验入池」的读数路径也未建立
    notes: "U-A9 逃跑成功率/失败惩罚未知；U-A10 副本是否仍刷新杰拉特未知；「每天只能获得一次」的判定点未知。另注：文档称经验池 5,000（Round 2 历史值），Round 4 未重读 → 当前余额未知。"
  - id: puni.prepare.exp_boost
    legacy_id: P0-03
    title: 开启 8 倍经验 / 4 倍学习力
    description: 在精灵太空站与初级班/高级班辅导员对话，打开当日的 8 倍经验与 4 倍学习力。
    phase: P0
    priority: 64
    prerequisites: [state.logged_in, puni.prepare.tutor_room]
    requires_capabilities: [input.click, observe.ocr]
    completion:
      type: verified_account_state
      predicate: feature_unlocked
      args: {feature: buff.exp8x}
    status: todo
    executable: false
    skill: game.toggle_daily_buff
    skill_inputs: {buff: exp8x}
    budget: {max_minutes: 10, max_battles: 0, max_spend: 0}
    on_failure: pause_and_replan
    evidence:
      - docs/PUNI_TASK_GRAPH.md#P0-03
    blocked_reason: 房间已标定（puni.prepare.tutor_room 已完成：星图第 3 个目的地 = 辅导员房间），但两个 NPC 打开的都是「精灵模拟训练」面板；8 倍/4 倍开关本身在任何素材里都没有被捕获，点哪里仍是 UNKNOWN。提示文本「已开启/已耗尽」的读数同样未验证
    notes: "U-C3 每日重置时刻未知；U-A11 每日时长未知。文档标 auto 的是 P0-04 签到，本节点是 semi-auto（需对话导航 + OCR 确认）。"
  - id: puni.prepare.daily_signin
    legacy_id: P0-04
    title: 每日签到领奖
    description: 点「我要签到」并清掉确认弹窗，领取每日奖励。
    phase: P0
    priority: 30
    prerequisites: [state.logged_in]
    requires_capabilities: [input.click, observe.ocr]
    completion:
      type: verified_account_state
      predicate: feature_unlocked
      args: {feature: daily.signin}
    status: todo
    executable: false
    skill: game.daily_signin
    skill_inputs: {days: 1}
    budget: {max_minutes: 5, max_battles: 0, max_spend: 0}
    on_failure: retry
    evidence:
      - docs/PUNI_TASK_GRAPH.md#P0-04
      - docs/state.md#待重新标定
    blocked_reason: 签到入口坐标从未标定（docs/state.md「待重新标定」列了底栏/顶部一排入口，全部未重测）
    notes: "文档把它评为 auto（动作集合 ⊆ 已验证原语），这一点仍然成立；缺的只是入口一次标定。签到按钮「已签到」状态需要 OCR 读数才能判定完成。"
  - id: puni.prepare.animation_off
    legacy_id: P0-05
    title: 关闭出招动画（呼吸模式 + 压缩超长出招动画）
    description: 在系统设置里勾选「呼吸模式」与「压缩超长出招动画」，缩短全场战斗时长。
    phase: P0
    priority: 65
    prerequisites: [state.logged_in]
    requires_capabilities: [settings.animation, input.click]
    completion:
      type: verified_account_state
      predicate: feature_unlocked
      args: {feature: settings.compressed_animation}
    status: todo
    executable: false
    skill: game.toggle_setting
    skill_inputs: {setting: compressed_animation, value: true}
    budget: {max_minutes: 10, max_battles: 0, max_spend: 0}
    on_failure: pause_and_replan
    evidence:
      - docs/PUNI_TASK_GRAPH.md#P0-05
    blocked_reason: 系统设置面板在新坐标系下未标定；勾选后的读回（勾选框状态）未实现
    notes: "U-B11 加速比未知，直接影响全场耗时预算 —— 没测出来之前所有 max_minutes 都只是上界。"
  - id: puni.prepare.buy_potions
    legacy_id: P0-06
    title: 采购体力 / 活力药剂
    description: 在商店买高级体力药剂、超级体力药剂、高级活力药剂若干，供长战（封印 1 起）使用。
    phase: P0
    priority: 60
    prerequisites: [state.logged_in]
    requires_capabilities: [shop.buy, observe.ocr]
    completion:
      type: verified_account_state
      predicate: resource_at_least
      args: {resource: 高级体力药剂, amount: 100}
    status: unknown
    executable: false
    skill: game.buy_items
    skill_inputs: {read_only: true}
    budget: {max_minutes: 15, max_battles: 0, max_spend: 0}
    on_failure: mark_blocked
    evidence:
      - docs/PUNI_TASK_GRAPH.md#P0-06
    blocked_reason: 货币余额与药剂价格本轮都未观测；CAP-SHOP 从未成功购买过任何商品 → 也不能断言「买不起」
